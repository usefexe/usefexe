<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc"><title id="title">About Youssef</title><desc id="desc">Web developer from Morocco, currently learning at YouCode Safi; interested in front-end and full-stack development and collaboration.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111722"/><stop offset="1" stop-color="#090d14"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#4ba9ff" stop-opacity=".13"/><stop offset="1" stop-color="#4ba9ff" stop-opacity="0"/></radialGradient>
<linearGradient id="gold"><stop stop-color="#ffde21"/><stop offset="1" stop-color="#f8ad37"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#344054" stroke-opacity=".18" fill="none"/></pattern>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.sans{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Liberation Mono,monospace}.pulse{animation:pulse 3.2s ease-in-out infinite}.flow{animation:flow 4s linear infinite}.blink{animation:blink 1.2s steps(1) infinite}@keyframes pulse{50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes blink{50%{opacity:.1}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.blink{animation:none}}</style>
</defs><rect x="1" y="1" width="998" height="248" rx="19" fill="url(#bg)" stroke="#344052" stroke-width="2"/><rect x="4" y="4" width="992" height="242" rx="16" fill="url(#grid)"/><ellipse cx="890" cy="125" rx="210" ry="178.57142857142858" fill="url(#aura)"/><text x="32" y="32" class="mono" font-size="13" fill="#ffde21" font-weight="600" letter-spacing="1.5">// 01 / IDENTITY</text><text x="32" y="67" class="sans" font-size="29" fill="#e9edf5" font-weight="750">Developer profile</text><path d="M32 85L968 85" stroke="#2b3442" stroke-width="1"/><circle cx="953" cy="32" r="3" fill="#60caff"/><circle cx="953" cy="32" r="7" fill="none" stroke="#60caff" stroke-opacity=".5" class="pulse"/><rect x="32" y="105" width="577" height="119" rx="12" fill="#10151e" stroke="#354256"/><text x="50" y="130" class="mono" font-size="15" fill="#7bcaff" font-weight="600">youssef@youcode:~$</text><text x="230" y="130" class="mono" font-size="15" fill="#ffde21" font-weight="400">whoami</text><text x="50" y="160" class="sans" font-size="20" fill="#e9edf5" font-weight="700">Web developer based in Morocco.</text><text x="50" y="188" class="sans" font-size="16" fill="#a9b6c9" font-weight="400">Building real products while learning how they work.</text><text x="50" y="210" class="mono" font-size="14" fill="#a9b6c9" font-weight="400">Understand first. Build second. Improve always.</text><rect x="475" y="199" width="8" height="13" rx="1" fill="#ffde21" class="blink"/><rect x="627" y="105" width="341" height="119" rx="12" fill="#111a27" stroke="#344052"/><text x="646" y="130" class="mono" font-size="12" fill="#899bb0" font-weight="400" letter-spacing="1.4">CURRENT STATUS</text><circle cx="649" cy="154" r="4" fill="#57d79a"/><text x="663" y="160" class="sans" font-size="18" fill="#e9edf5" font-weight="700">YouCode Safi</text><text x="646" y="188" class="sans" font-size="15" fill="#c3cedd" font-weight="400">Focus: Frontend + Full Stack</text><text x="646" y="210" class="sans" font-size="15" fill="#f5d94b" font-weight="400">Open to collaboration</text></svg>