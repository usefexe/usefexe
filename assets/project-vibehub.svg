<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="216" viewBox="0 0 1000 216" role="img" aria-labelledby="title desc"><title id="title">VibeHub Club</title><desc id="desc">A university club platform with event management, membership applications and role-based dashboards. Technologies: React, Express, MySQL, JWT. Click to open the repository.</desc><defs>
