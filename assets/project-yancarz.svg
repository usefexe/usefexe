<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="216" viewBox="0 0 1000 216" role="img" aria-labelledby="title desc"><title id="title">YanCarz</title><desc id="desc">Car rental portal for multiple agencies. React interface with multilingual support and centralized state. Technologies: React, Redux Toolkit, Tailwind CSS, i18next. Click to open the repository.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111722"/><stop offset="1" stop-color="#090d14"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#4ba9ff" stop-opacity=".13"/><stop offset="1" stop-color="#4ba9ff" stop-opacity="0"/></radialGradient>
<linearGradient id="gold"><stop stop-color="#ffde21"/><stop offset="1" stop-color="#f8ad37"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#344054" stroke-opacity=".18" fill="none"/></pattern>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.sans{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Liberation Mono,monospace}.pulse{animation:pulse 3.2s ease-in-out infinite}.flow{animation:flow 4s linear infinite}.blink{animation:blink 1.2s steps(1) infinite}@keyframes pulse{50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes blink{50%{opacity:.1}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.blink{animation:none}}</style>
